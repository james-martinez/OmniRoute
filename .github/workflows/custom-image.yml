name: Custom image (GHCR only)

# One-off builder for james-martinez's custom OmniRoute image.
# Mirrors docker-publish.yml's proven hosted-runner settings:
# ubuntu-24.04 + 10GB swap (build.yml) + OMNIROUTE_USE_TURBOPACK=0 +
# OMNIROUTE_BUILD_MEMORY_MB=12288 (validated on 16 GB hosted runners).
# Pushes only to ghcr.io/james-martinez/omniroute — no Docker Hub.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (ghcr.io/james-martinez/omniroute:<tag>)"
        required: true
        default: "3.8.53-pr17312"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build & push runner-base amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
            OPENROUTED_BUILD_SHA=${{ github.sha }}
            OPENROUTED_BUILD_VARIANT=custom
            OPENROUTED_VERSION=${{ inputs.tag }}
          push: true
          tags: ghcr.io/james-martinez/omniroute:${{ inputs.tag }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,scope=docker-amd64,mode=max,ignore-error=true
